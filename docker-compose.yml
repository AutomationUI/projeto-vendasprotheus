version: "3.8"

services:
  # ─── Main SaaS Application (API + WebSocket + SPA) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendasprotheus-saas-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${API_KEY:-dev-api-key}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Supabase Cloud / Self-Hosted Configuration
      - SUPABASE_URL=${SUPABASE_URL:-https://dhzfotrxrhyzfxufgakc.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoemZvdHJ4cmh5emZ4dWZnYWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDM3ODAsImV4cCI6MjEwNDAxOTc4MH0.0DbpWD8cTJTti2_iNrHFzT6_mOvUYwQwO_G6CD02HWs}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # TOTVS Protheus ERP Configuration
      - PROTHEUS_BASE_URL=${PROTHEUS_BASE_URL:-http://localhost:3000/mock-protheus}
      - PROTHEUS_USER=${PROTHEUS_USER:-}
      - PROTHEUS_PASS=${PROTHEUS_PASS:-}
      - PROTHEUS_TENANT_ID=${PROTHEUS_TENANT_ID:-01}
      # SMTP Messaging
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-VendasProtheus}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@vendasprotheus.com}
      # WhatsApp Cloud API
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    name: saas-network
